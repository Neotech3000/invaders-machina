function paintGodMark(ink, bg) {
const cx = Math.floor(W / 2);
const g = ((R.god - 1) % 12) + 1;
if (g === 1) {

drawLine(cx + 44, 98, cx + 34, 114, ink);
drawLine(cx + 34, 114, cx + 46, 114, ink);
drawLine(cx + 46, 114, cx + 32, 134, ink);
} else if (g === 2) {
for (const dx of [-28, 0, 28]) {
drawCircle(cx + dx, 102, 6, ink);
fillCircle(cx + dx, 102, 2, ink);
}
} else if (g === 3) {
for (const y of [104, 122]) {
for (let x = 48; x < W - 56; x += 10) {

drawLine(x, y + (down ? 0 : 5), x + 10, y + (down ? 5 : 0), ink);
}
}
} else if (g === 4) {
for (const x of [cx - 36, cx, cx + 36]) {
fillRect(x, 92, 2, 16, ink);
drawLine(x, 96, x - 6, 92, ink);
drawLine(x + 1, 100, x + 7, 96, ink);
drawLine(x, 104, x - 6, 100, ink);
}
} else if (g === 5) {
drawLine(cx, 90, cx - 14, 104, ink);
drawLine(cx, 90, cx + 14, 104, ink);
drawLine(cx - 14, 104, cx - 14, 118, ink);
drawLine(cx + 14, 104, cx + 14, 118, ink);
drawLine(cx - 14, 118, cx, 132, ink);
drawLine(cx + 14, 118, cx, 132, ink);
} else if (g === 6) {
drawLine(cx - 30, 94, cx - 8, 132, ink);
drawLine(cx + 30, 94, cx + 8, 132, ink);
} else if (g === 7) {
for (let dx = -1; dx <= 1; dx++) {
for (let dy = -1; dy <= 1; dy++) {
if (!dx && !dy) continue;
const inner = dx && dy ? 6 : 8;
const outer = dx && dy ? 14 : 18;
drawLine(cx + dx * inner, 108 + dy * inner, cx + dx * outer, 108 + dy * outer, ink);
}
}
} else if (g === 8) {
drawCircle(cx, 108, 10, ink);
fillCircle(cx + 6, 106, 8, bg);
} else if (g === 9) {
fillCircle(cx - 5, 100, 5, ink);
fillCircle(cx + 5, 100, 5, ink);
drawLine(cx - 10, 102, cx, 118, ink);
drawLine(cx + 10, 102, cx, 118, ink);
} else if (g === 10) {
fillRect(cx - 12, 96, 24, 5, ink);
fillRect(cx - 6, 101, 12, 8, ink);
fillRect(cx - 14, 109, 28, 4, ink);
} else if (g === 11) {
drawLine(cx - 8, 108, cx - 28, 100, ink);
drawLine(cx - 8, 108, cx - 26, 112, ink);
drawLine(cx - 16, 106, cx - 28, 108, ink);
drawLine(cx + 8, 108, cx + 28, 100, ink);
drawLine(cx + 8, 108, cx + 26, 112, ink);
drawLine(cx + 16, 106, cx + 28, 108, ink);
} else {
fillCircle(cx, 96, 3, ink);
fillCircle(cx - 8, 100, 3, ink);
fillCircle(cx + 8, 100, 3, ink);
fillCircle(cx - 4, 108, 3, ink);
fillCircle(cx + 4, 108, 3, ink);
fillCircle(cx, 114, 3, ink);
}
}

function divineToggle(idx) {
divMsg = "";
const bit = 1 << idx;
if ((save.gods & bit) === 0) { divMsg = "LOCKED"; return; }
if ((save.dive & bit) !== 0) save.dive = (save.dive & ~bit) & 0xfff;
else if (popCount(save.dive) >= divineSlots()) { divMsg = "NEED MULTI"; return; }
else save.dive = (save.dive | bit) & 0xfff;
save.dive &= save.gods;
persist();
}

reg(BOX.shopPage, () => { shopPage = (shopPage + 1) % pages; });
}
if (shopMsg) drawText(shopMsg, 140, 410, P.accent, "f2", "ml");
drawKey("BACK", BOX.home, false, P);
reg(BOX.home, () => goMenu());
}
function paintForge(P) {
FB.fill(P.bg);
if (forgeFlash > 0) return;
drawText("FORGE", 12, 18, P.ink, "f2", "ml");
drawText("$" + save.coins, W - 12, 18, P.accent, "f2", "mr");
if (forgeStep === 0 || forgeStep === 1) {
const tabs = ["GUNS", "POWER", "UPGRADE"];
for (let t = 0; t < 3; t++) {
drawKey(tabs[t], forgeTabBox(t), t === forgeTab, P);
reg(forgeTabBox(t), () => {
forgeTab = t;
forgeStep = 0;
forgePage = 0;
forgeFirst = 0;
forgeSecond = 0;
forgeMsg = "";
});
}
if (forgeStep === 0) drawText("PICK THE FIRST ITEM", W / 2, 78, P.muted, "f2", "mc");
else drawText("FIRST: " + forgeItemName(forgeTab, forgeFirst), W / 2, 78, P.muted, "f2", "mc");
const count = forgeItemCount(forgeTab);
const pages = Math.ceil(count / 6);
if (forgePage >= pages) forgePage = 0;
for (let row = 0; row < 6; row++) {
const idx = forgePage * 6 + row;
if (idx >= count) break;
const b = forgeRowBox(row);
const first = forgeStep === 1 && idx === forgeFirst;
fillRect(b.x, b.y, b.w, b.h, P.button);
drawRect(b.x, b.y, b.w, b.h, first ? P.accent : P.button);
drawText(forgeItemName(forgeTab, idx), b.x + 12, b.y + Math.floor(b.h / 2), P.ink, "f2", "ml");
let status = "PICK";
if (forgeTab === 0 && !forgeItemOwned(0, idx)) status = "LOCKED";
else if (first) status = "FIRST";
drawText(status, b.x + b.w - 10, b.y + Math.floor(b.h / 2), P.muted, "f2", "mr");
reg(b, () => forgePick(row));
}
if (pages > 1) {
drawKey("PAGE " + (forgePage + 1) + "/" + pages, BOX.forgePage, false, P);
reg(BOX.forgePage, () => { forgePage = (forgePage + 1) % pages; });
}
if (forgeAnyValid() && (forgeTab === 0 || forgeTab === 2)) {
const lv = gunLv(activeForgeGun());
const lbl = lv >= 5 ? "FORGED MAX" : "UPG LV" + (lv + 1) + " $" + (50 * (lv + 1));
drawKey(lbl, BOX.forgeUp, false, P);
reg(BOX.forgeUp, () => forgeUpgradeGun());
}
if (forgeMsg) drawText(forgeMsg, 12, 402, P.accent, "f2", "ml");
drawKey("BACK", BOX.home, false, P);
reg(BOX.home, () => forgeBack());
return;
}
if (forgeStep === 2 || forgeStep === 3) {
const item = forgeStep === 2 ? forgeFirst : forgeSecond;
if (forgeStep === 2) {
drawText("FIRST: " + forgeItemName(forgeTab, item), W / 2, 56, P.muted, "f2", "mc");
drawText("PICK AN ATTRIBUTE", W / 2, 76, P.accent, "f2", "mc");
} else {
drawText("FIRST: " + forgeItemName(forgeTab, forgeFirst) + " " +
forgeAttrName(forgeTab, forgeFirst, forgeAttrA), W / 2, 56, P.muted, "f2", "mc");
drawText("SECOND: " + forgeItemName(forgeTab, item), W / 2, 76, P.muted, "f2", "mc");
}
for (let a = 0; a < 5; a++) {
const b = forgeAttrRowBox(a);
fillRect(b.x, b.y, b.w, b.h, P.button);
drawRect(b.x, b.y, b.w, b.h, P.button);
drawText(forgeAttrName(forgeTab, item, a), b.x + 12, b.y + Math.floor(b.h / 2), P.ink, "f2", "ml");
drawText("$" + forgeAttrPrice(a), b.x + b.w - 10, b.y + Math.floor(b.h / 2), P.accent, "f2", "mr");
reg(b, () => forgePick(a));
}
drawKey("BACK", BOX.home, false, P);
reg(BOX.home, () => forgeBack());
return;
}
if (forgeStep === 4) {
drawText("COMBINE?", W / 2, 100, P.ink, "f4", "mc");
drawText(forgeItemName(forgeTab, forgeFirst) + " " +
forgeAttrName(forgeTab, forgeFirst, forgeAttrA), W / 2, 148, P.ink, "f2", "mc");
drawText("+", W / 2, 172, P.muted, "f2", "mc");
drawText(forgeItemName(forgeTab, forgeSecond) + " " +
forgeAttrName(forgeTab, forgeSecond, forgeAttrB), W / 2, 196, P.ink, "f2", "mc");
drawText("TOTAL $" + forgeTotal(), W / 2, 228, P.accent, "f2", "mc");
if (forgeMsg) drawText(forgeMsg, W / 2, 252, P.accent, "f2", "mc");
drawKey("YES", BOX.forgeYes, false, P);
drawKey("NO", BOX.forgeNo, false, P);
reg(BOX.forgeYes, () => forgeConfirm());
reg(BOX.forgeNo, () => { forgeStep = 3; forgeMsg = ""; });
return;
}
drawText("FORGED!", W / 2, 92, P.ink, "f4", "mc");
drawText(forgeRevealName(), W / 2, 138, P.accent, "f2", "mc");
if (forgeTab === 0 && forgeAnyValid()) {
const lv = gunLv(activeForgeGun());
drawText("LV" + (lv + 1) + "  " + forgedSlotCount() + "/8 TRAITS (+" + forgedLatestTrait() + ")",
W / 2, 168, P.muted, "f2", "mc");
} else {
drawText(forgeTab === 1 ? "NEW POWER-UP" : "NEW UPGRADE", W / 2, 168, P.muted, "f2", "mc");
}
if (forgeMsg) drawText(forgeMsg, W / 2, 204, P.accent, "f2", "mc");
if (forgeTab === 0 && forgeAnyValid() && gunLv(activeForgeGun()) < 5) {
const lv = gunLv(activeForgeGun());
drawKey("UPGRADE $" + (50 * (lv + 1)), BOX.forgeRevealUp, false, P);
reg(BOX.forgeRevealUp, () => forgeUpgradeGun());
}
drawKey(forgeTab === 0 ? "EQUIP" : "DONE", BOX.forgeEquip, false, P);
drawKey("BACK", BOX.home, false, P);
reg(BOX.forgeEquip, () => {
if (forgeTab === 0 && forgeAnyValid()) { save.gunEquip = activeForgeGun(); persist(); }
goMenu();
});
reg(BOX.home, () => forgeBack());
}
function render() {
const P = palFor(save.theme);
btns = [];
if (scr === "demo" || scr === "play" || scr === "splash" || scr === "advance" || scr === "pause" || scr === "over") {
if (scr === "over") {
paintOver(P);
} else if (scr === "splash") {
paintLevel(P, { left: false, right: false, fire: false });
paintSplash(P);
} else if (scr === "pause") {
paintLevel(P, { left: false, right: false, fire: false });
paintPause(P);
} else if (scr === "advance") {
paintLevel(P, { left: false, right: false, fire: false });
paintAdvance(P);
} else {
paintLevel(P, scr === "demo" ? { left: false, right: false, fire: false } : playerInput());
}
} else if (scr === "menu") paintMenu(P);
else if (scr === "divine") paintDivine(P);
else if (scr === "checks") paintChecks(P);
else if (scr === "shop") paintShop(P);
else if (scr === "forge") paintForge(P);
else if (scr === "custom") paintCustom(P);
else if (scr === "confirm") paintConfirm(P);
if (kbActive && btns[sel]) {
const b = btns[sel];
drawRect(b.x + 2, b.y + 2, b.w - 4, b.h - 4, P.ink);
}
ctx.putImageData(IMG, 0, 0);
}
function menuNav() {
if (pressed.has("up") && btns.length) sel = (sel + btns.length - 1) % btns.length;
if (pressed.has("down") && btns.length) sel = (sel + 1) % btns.length;
if (pressed.has("left") && scr === "shop") { shopTab = (shopTab + 5) % 6; shopPage = 0; }
if (pressed.has("right") && scr === "shop") { shopTab = (shopTab + 1) % 6; shopPage = 0; }
if (pressed.has("tab") && scr === "shop") shopPage = (shopPage + 1) % Math.max(1, Math.ceil(shopCount(shopTab) / 6));
if ((pressed.has("left") || pressed.has("right")) && scr === "forge" && forgeStep <= 1) {
forgeTab = (forgeTab + (pressed.has("left") ? 2 : 1)) % 3;
forgeStep = 0;
forgePage = 0;
forgeFirst = 0;
forgeSecond = 0;
forgeMsg = "";
}
if (pressed.has("tab") && scr === "forge" && forgeStep <= 1) {
forgePage = (forgePage + 1) % Math.max(1, Math.ceil(forgeItemCount(forgeTab) / 6));
}
if (pressed.has("enter") || pressed.has("space")) {
const b = btns[sel];
if (b && b.fn) b.fn();
}
if (pressed.has("esc")) {
if (scr === "pause") resumePlay();
else if (scr === "play") beginPause();
else if (scr === "demo") goMenu();
else if (scr === "custom" && customFromPause) beginPause();
else if (scr === "forge") forgeBack();
else if (scr === "over") goMenu();
else if (scr !== "menu") goMenu();
}
}
function step() {
if (scr === "forge" && forgeFlash > 0) forgeFlash -= 1;
if (scr === "demo") {
if (pressed.has("enter") || pressed.has("space") || pressed.has("esc")) goMenu();
} else if (scr === "play") {
if (pressed.has("esc")) beginPause();
} else if (scr !== "splash" && scr !== "advance") {
menuNav();
}
pressed.clear();
if (scr === "demo") stepPlay(demoInput());
else if (scr === "play") stepPlay(playerInput());
else if (scr === "advance") {
if (--R.timer <= 0) startLevel();
} else if (scr === "splash") {
if (--R.timer <= 0) {
if (R.raidSplash) {
R.raidSplash = false;
R.msg = raidTell(R.boss ? R.boss.style : 0);
R.msgT = 45;
setScr("play");
} else godFight();
}
}
}
let acc = 0;
let last = performance.now();
function loop(now) {
acc += Math.min(100, now - last);
last = now;
while (acc >= TICK_MS) {
step();
acc -= TICK_MS;
}
render();
requestAnimationFrame(loop);
}
startDemo();
requestAnimationFrame(loop);
</script>
</body>
</html>
