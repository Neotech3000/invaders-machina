; Env name "cyd" is the plan's placeholder. It is not a part number.
;
; Board definition: esp32dev
;   Arduino name: ESP32 Dev Module
;   Chosen from the chip read on the CH340 by-id path:
;   ESP32-D0WD-V3 rev v3.1, 4MB flash, no embedded PSRAM, 40 MHz, DIO.
;   That is the module the ESP32-3248S035 class uses.
;   Panel is confirmed: ST7796, SPI2, the pins in
;   src/hardware/hardware_config.h. Do not change that pinout.
;
; upload_port is the QinHeng CH340 only.
; Never point this at /dev/ttyACM0 or /dev/ttyACM1 (Framework LED matrices).

[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
monitor_port = /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
monitor_speed = 115200
upload_speed = 115200
board_build.flash_mode = dio
board_build.f_flash = 40000000
board_upload.flash_size = 4MB
lib_deps =
    lovyan03/LovyanGFX@^1.2.0
build_flags = -DCORE_DEBUG_LEVEL=0
