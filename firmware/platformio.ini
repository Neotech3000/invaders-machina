; Target board: ESP32-3248S035 class (3.5 inch, 320x480 ST7796, XPT2046).
; Chip class: ESP32-D0WD-V3, 4MB flash, no PSRAM, 40 MHz flash, DIO mode.
; Pinout: src/hardware/hardware_config.h. Do not change that pinout.
;
; espressif32 is pinned to 6.13.0. That release still uses Arduino-ESP32 2.0.17.
; An unpinned "espressif32" currently resolves to 8.x (Arduino-ESP32 3.x) and
; does not build this project.
;
; No serial port is set here. When only one serial device is plugged in,
; PlatformIO selects it. To pin a port, copy platformio.local.ini.example to
; platformio.local.ini (the copy is git-ignored) and edit it.

[platformio]
default_envs = cyd
extra_configs = platformio.local*.ini

[env:cyd]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.flash_mode = dio
board_build.f_flash = 40000000
board_upload.flash_size = 4MB
lib_deps =
    lovyan03/LovyanGFX@^1.2.0
    bblanchon/ArduinoJson@^7.2.1
build_flags = -DCORE_DEBUG_LEVEL=0
