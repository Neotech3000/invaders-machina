; ESP32-C6-LCD-1.47 (Waveshare / the Wonrabai 1.47 inch listing).
; 172x320 ST7789, RGB LED on GPIO8, ESP32-C6FH4, 4MB flash.
; Separate from the 3.5 inch cabinet game in the parent firmware folder.
;
; espressif32 8.0.0 is the PlatformIO release that builds Arduino for ESP32-C6.
; The cabinet game stays on espressif32 6.13.0. Do not retarget that env here.
;
; Upload is guarded by scripts/guard_upload.py. It opens only an Espressif
; USB JTAG device (vendor 303a, product 1001), which is the port on this panel.

[env:c6panel]
platform = espressif32@8.0.0
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = default.csv
build_flags = -DCORE_DEBUG_LEVEL=0
extra_scripts = post:scripts/guard_upload.py
